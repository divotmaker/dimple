[package]
name = "dimple"
version = "0.0.3"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Golf ball-flight physics: aerodynamics, RK4 trajectory, bounce, and rollout"
repository = "https://github.com/divotmaker/dimple"
readme = "README.md"
keywords = ["golf", "ballistics", "physics", "aerodynamics"]
categories = ["science", "simulation"]
exclude = ["CLAUDE.md", ".github/", "rust-toolchain.toml"]

[lib]
name = "dimple"

[dependencies]
glam = "0.32"
