[package]
name = "dimple"
version = "0.0.10"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "Golf ball-flight physics: aerodynamics, RK4 trajectory, bounce and roll on pluggable terrain"
repository = "https://github.com/divotmaker/dimple"
readme = "README.md"
keywords = ["golf", "ballistics", "physics", "aerodynamics"]
categories = ["science", "simulation"]
exclude = [".github/", "rust-toolchain.toml"]

[lib]
name = "dimple"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The fit doc generator carries the test that keeps docs/FIT.md current.
[[example]]
name = "fit_doc"
test = true
